[package]
name = "mooring-session"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
mooring-platform = { path = "../mooring-platform" }
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.10", default-features = false }
# SPAKE2 turns a six-character PIN into a full-strength pairing key. Both are
# MIT OR Apache-2.0; curve25519-dalek is already used through snow.
spake2 = "0.4"
curve25519-dalek = { version = "4", default-features = false }
snow = { version = "0.10", default-features = false, features = ["std", "use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom"] }
getrandom = "0.4"
libc = "0.2"
zeroize = "1"
