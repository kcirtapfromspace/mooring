[workspace]
members = ["crates/mooring-core", "crates/mooring-platform", "crates/mooring-cli", "crates/mooring-session"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
